{% extends "base.html" %}
{% load static %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="authbg">
  <div class="authcard">
    <div class="seg"><a href="{% url 'login' %}">Вход</a><a class="on" href="{% url 'register' %}">Регистрация</a></div>
    <h1>Создайте аккаунт</h1>
    <form method="post" data-validate>
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary btn-block" type="submit">Зарегистрироваться</button>
    </form>
  </div>
</div>
{% endblock %}
