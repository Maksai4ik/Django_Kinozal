{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Кинозал{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="{% url 'index' %}" class="logo">▼ КИНОЗАЛ</a>
            <nav class="nav">
                <a href="{% url 'index' %}">Афиша</a>
                {% if user.is_authenticated %}
                    <a href="#">{{ user.username }}</a>
                {% else %}
                    <a href="#">Войти</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Кинотеатр «Кинозал». Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
