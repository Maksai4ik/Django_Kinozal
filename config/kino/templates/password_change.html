{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="authbg">
  <div class="authcard">
    <p class="crumbs"><a href="{% url 'profile' %}">← Назад в профиль</a></p>
    <h1>Смена пароля</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary btn-block" type="submit">Сохранить новый пароль</button>
    </form>
  </div>
</div>
{% endblock %}
